<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Admin Panel</h1>
    <a href="/" class="btn secondary">Back to Home</a>
    <hr>

    <div class="card">
      <h2>Add New Item</h2>
      <form id="addForm">
        <input type="text" id="title" placeholder="Item Title" required><br>
        <textarea id="description" placeholder="Item Description" required></textarea><br>
        <button type="submit" class="btn">Save Item</button>
      </form>
    </div>

    <h2>Manage Items</h2>
    <div id="adminItemList" class="item-list">Loading...</div>
  </div>

  <script>
    async function loadAdminItems() {
      const res = await fetch('/api/items');
      const result = await res.json();
      const container = document.getElementById('adminItemList');

      if (result.success && result.data.length > 0) {
        container.innerHTML = result.data.map(item => `
          <div class="card space-between">
            <div>
              <h3>${item.title}</h3>
              <p>${item.description}</p>
            </div>
            <button onclick="deleteItem(${item.id})" class="btn danger">Delete</button>
          </div>
        `).join('');
      } else {
        container.innerHTML = '<p>No items found!</p>';
      }
    }

    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value;
      const description = document.getElementById('description').value;

      const res = await fetch('/api/items', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, description })
      });

      if (res.ok) {
        document.getElementById('title').value = '';
        document.getElementById('description').value = '';
        loadAdminItems();
      } else {
        alert('Failed to add item!');
      }
    });

    async function deleteItem(id) {
      if (!confirm('Are you sure?')) return;
      
      const res = await fetch(`/api/items/${id}`, { method: 'DELETE' });
      if (res.ok) {
        loadAdminItems();
      } else {
        alert('Failed to delete item!');
      }
    }

    loadAdminItems();
  </script>
</body>
</html>
